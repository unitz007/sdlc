version: 2

project_name: sdlc

before:
  hooks:
    - go mod tidy

builds:
  - id: sdlc
    binary: sdlc
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X sdlc/cmd.Version={{ .Version }}

archives:
  - id: sdlc
    ids: [sdlc]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt


release:
  github:
    owner: unitz007
    name: sdlc

changelog:
  use: github-native
